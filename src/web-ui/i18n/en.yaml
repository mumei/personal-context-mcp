helpIntroTitle: "Using Personal Context MCP"
helpIntroBody: "Personal Context MCP is a local memory and audit layer that lets multiple AI clients share the same task status, work journal, and durable knowledge."
helpPrinciplesTitle: "Core principles"
helpLocalTitle: "Keep local data authoritative"
helpLocalBody: "Data is stored under the configured Personal Context MCP data root. The Web UI audits that data, while AI clients use the same information through MCP tools."
helpSeparationTitle: "Separate records, memory, and output"
helpSeparationBody: "Work facts, reusable knowledge, and human-facing reports are managed separately so temporary details do not pollute long-term memory."
helpClientTitle: "Remain AI-client neutral"
helpClientBody: "Codex, Claude Code, Cursor, Copilot, Gemini, LM Studio, and other clients can use the same data. The LLM Provider is selected from the client or environment configuration."
helpFlowTitle: "Data flow"
helpFlowBody: "Activity is the factual starting point. Only durable information is organized into Context and Task Memory. Reports and briefings are generated from this saved data."
helpActivityShort: "Immutable chronological work journal"
helpMemoryShort: "Current overview and reusable knowledge"
helpReportShort: "Human-facing output for a date"
helpDataTitle: "Purpose of each data type"
helpActivityRole: "An append-only journal of what happened and when. Dated progress, investigation, and execution results belong here."
helpContextRole: "Stores the task purpose, background, references, and current overview. It explains the task rather than recording individual work events."
helpMemoryRole: "Task-scoped long-term memory for settled specifications, decisions, continuing risks, and knowledge needed in later sessions."
helpReportRole: "Dated presentation data generated from Activity, Context, Task Memory, and related sources. It is not the authoritative memory store."
helpGlobalRole: "User policies and rules shared across all tasks. Task-specific information belongs in Task Memory."
helpKnowledgeRole: "Store only concepts, systems, technologies, organizations, decisions, and documents that remain meaningful without the originating task name or date and can be reused across multiple tasks. Notes are self-contained with embedded claims and evidence; content that cannot be generalized is not registered, and file paths are never used as evidence."
helpPeopleRole: "Store local-only person profiles, relationships to the user, person-to-person relationships, and dated interaction history. Confirmed, observed, and inferred information remain distinct and are never sent automatically to an LLM or Knowledge."
helpWorkflowTitle: "Standard AI workflow"
helpStepUnderstandTitle: "Understand the situation"
helpStepUnderstandBody: "Read the usage guide first, then retrieve the target task or search across tasks for the current situation."
helpStepRecordTitle: "Record work facts"
helpStepRecordBody: "Append investigation, decisions, and results to Activity. Activity is the original journal and is not compacted or replaced later."
helpStepFinishTitle: "Finish the task session"
helpStepFinishBody: "At the end of work on one task, update its latest display, daily snapshot, and requested outputs together."
helpStepPromoteTitle: "Organize durable memory"
helpStepPromoteBody: "Only when reusable facts exist, consolidate Activity with existing memory and update Task Memory."
helpStepOutputTitle: "Generate briefings and reports"
helpStepOutputBody: "Generate the daily overview or Text and Markdown reports for people from saved facts and memory."
helpWebTitle: "What the Web UI does"
helpWebBody: "The Web UI lets people audit Personal Context MCP data and explicitly request generation or organization operations."
helpWebSummary: "Summary: review and generate today's schedule, attention items, priorities, and recommended actions."
helpWebTask: "Tasks: inspect Context, current status, Task Memory, Activity, and mind maps."
helpWebReport: "Reports: identify unreflected Activity and generate or copy Text and Markdown reports."
helpWebKnowledge: "Knowledge: search and audit task-independent knowledge, relations, and provenance as a graph."
helpWebSettings: "Settings: configure language, work-date boundary, LLM Provider, and daily-task automation."
helpSafetyTitle: "Operational safeguards"
helpSafetyActivity: "Activity is the original record. Do not copy daily work logs directly into Task Memory."
helpSafetyMemory: "Keep only information needed for future decisions in durable memory."
helpSafetyDelete: "Tasks use logical deletion and cleanup uses archives by default, so required data can be restored."
helpSafetySharing: "Saved data is sent to an LLM only when data sharing is explicitly allowed."
helpQuickTitle: "When unsure"
helpQuickBody: "Tell the AI to read system_get_usage_guide first and use session_finish_task for normal session completion. Use this Web UI to audit the saved result."
