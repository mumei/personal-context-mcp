dailyTaskDefaultPrompt: |
  Personal Context MCPを使って当日のブリーフィングを日本語で生成してください。
  最初にsystem_get_usage_guideを確認し、briefing_generate_dailyを1回だけ実行してください。
  外部取得スクリプトや~/.tasks配下のファイルを直接実行・編集しないでください。
  成功時は返却されたweb_urlと、今日注意が必要なタスク、推奨アクションを簡潔に提示してください。
  失敗時は再試行を繰り返さず、エラー全文と失敗段階を報告してください。
