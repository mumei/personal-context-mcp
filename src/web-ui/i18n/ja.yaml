helpIntroTitle: "Personal Context MCPの使い方"
helpIntroBody: "Personal Context MCPは、複数のAIクライアントが同じタスク状況、作業記録、長期記憶を共有するためのローカルな記憶・監査基盤です。"
helpPrinciplesTitle: "基本の考え方"
helpLocalTitle: "ローカルを正本にする"
helpLocalBody: "データは設定されたPersonal Context MCPデータルートに保存されます。Webは保存内容を監査し、AIクライアントはMCP toolを通じて同じ情報を利用します。"
helpSeparationTitle: "記録・記憶・出力を分ける"
helpSeparationBody: "作業の事実、将来も必要な知識、人に見せるレポートを別々に管理し、一時的な情報が長期記憶へ混ざることを防ぎます。"
helpClientTitle: "AIクライアントに依存しない"
helpClientBody: "Codex、Claude Code、Cursor、Copilot、Gemini、LM Studioなどから同じデータを利用できます。LLM Providerはクライアントまたは環境設定から選択されます。"
helpFlowTitle: "データの流れ"
helpFlowBody: "Activityを事実の出発点とし、必要な情報だけをContextとTask Memoryへ整理します。レポートとブリーフィングは、これらの保存データから生成されます。"
helpActivityShort: "変更しない時系列の作業記録"
helpMemoryShort: "現在の概要と再利用する長期知識"
helpReportShort: "日付ごとの人間向け出力"
helpDataTitle: "保存データの役割"
helpActivityRole: "いつ何をしたかを残す追記型ジャーナルです。日付付きの進捗、調査、実施結果はここへ記録します。"
helpContextRole: "タスクの目的、背景、参照先、現在の概要を保持します。単発の作業ログではなく、タスクを理解するための情報です。"
helpMemoryRole: "確定した仕様、判断、継続リスク、次回も必要な知識を保持するタスク単位の長期記憶です。"
helpReportRole: "Activity、Context、Task Memoryなどから生成する日付別の表示データです。記憶の正本ではありません。"
helpGlobalRole: "全タスクに共通するユーザーの方針やルールです。タスク固有の情報はTask Memoryへ保存します。"
helpKnowledgeRole: "元のタスク名と日付を外しても意味が通り、複数タスクで再利用できる概念、システム、技術、組織、判断、文書だけを、主張と根拠を内包した自己完結型ノートとして保持します。一般化できない内容は登録せず、ファイルパスも根拠として保存しません。"
helpPeopleRole: "人物プロフィール、ユーザーとの関係、人物間の関係、日付付き接点履歴をローカル専用で保持します。確認済み・観測・推測を区別し、LLMやKnowledgeへ自動送信しません。"
helpWorkflowTitle: "AIが使う標準フロー"
helpStepUnderstandTitle: "状況を理解する"
helpStepUnderstandBody: "最初に利用ガイドを確認し、対象タスクまたは横断検索から現在の状況を取得します。"
helpStepRecordTitle: "作業の事実を記録する"
helpStepRecordBody: "調査、判断、実施結果をActivityへ追記します。Activityは後から圧縮や置換をしない原本です。"
helpStepFinishTitle: "タスクセッションを完了する"
helpStepFinishBody: "1タスクの作業終了時に、最新表示、当日のスナップショット、必要な出力を一括更新します。"
helpStepPromoteTitle: "長期記憶へ整理する"
helpStepPromoteBody: "今後も必要な確定事項がある場合だけ、Activityと既存Memoryを整理してTask Memoryへ反映します。"
helpStepOutputTitle: "ブリーフィングとレポートを生成する"
helpStepOutputBody: "保存済みの事実と記憶から、人が読むための当日概要やText・Markdownレポートを生成します。"
helpWebTitle: "Webでできること"
helpWebBody: "WebはPersonal Context MCPに保存された内容を人が監査し、明示的な生成・整理操作を行うための画面です。"
helpWebSummary: "概要: 当日の予定、注意タスク、優先タスク、推奨アクションを確認・生成します。"
helpWebTask: "タスク: Context、現在の状況、Task Memory、Activity、マインドマップを確認します。"
helpWebReport: "レポート: 未反映Activityを確認し、TextまたはMarkdownを生成・コピーします。"
helpWebKnowledge: "ナレッジ: タスク非依存の知識、関係、根拠をグラフで検索・監査します。"
helpWebSettings: "設定: 言語、業務日境界、LLM Provider、デイリータスク自動化を確認・設定します。"
helpSafetyTitle: "運用上の注意"
helpSafetyActivity: "Activityは原本です。日次の作業内容をTask Memoryへそのまま転記しません。"
helpSafetyMemory: "長期記憶には、次回以降も判断に必要な情報だけを残します。"
helpSafetyDelete: "タスク削除は論理削除、クリーンアップはアーカイブを基本とし、必要なら復元できます。"
helpSafetySharing: "LLMへ保存データを送る処理は、データ共有を明示的に許可した場合だけ実行します。"
helpQuickTitle: "迷ったとき"
helpQuickBody: "AIには、最初にsystem_get_usage_guideを読み、通常の作業終了にはsession_finish_taskを使うよう指示してください。保存内容はこのWebから確認できます。"
